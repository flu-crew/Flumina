# The directory where output files will go
OUTPUT_DIRECTORY="/Full/Path/to/Flumina_analysis"

# The directory where your raw reads are located
READ_DIRECTORY="/Flumina/test_dataset"

# CSV with the file name that matches to both read pairs in the "File column" and sample name in the "Sample" column
RENAME_FILE="/Flumina/example_file_rename.csv"

# The path to the reference file
REFERENCE_FILE="/Flumina/reference.fa"

# Curated csv database with the columns "Gene", "Amino_Acid", and "Type" (category of site) of interest
AA_DB="/Flumina/curated_database.csv"

# A metadata file with at least one column named "Sample" to join databases
METADATA="/Flumina/example_metadata.csv"

# Group column name from metadata to summarize and group data i.e. cow versus birds versus poultry
GROUP_NAMES="discrete_host"

#minimum depth to keep a variant. Enforced when building the amino-acid table
#(findAAChanges.R). At low template input LoFreq/GATK4 report false fixations
#(founder/jackpot effect), so keep this >= 100 unless you have a specific reason.
MIN_DEPTH=100

#Minimum quality to keep a variant (0 disables)
MIN_QUALITY=30

#Optional swab deduplication (findAAChanges.R): comma-separated metadata columns
#that identify one biological sample sequenced in >1 replicate library. When set,
#replicate libraries are collapsed by keeping the DEEPEST call per
#(these columns + locus/position/alternative). Leave blank/unset to disable.
#DEDUP_KEYS=Animal.ID,DPI,Quarter

#Minimum allele frequency to consider variant
MIN_ALLELE_FREQUENCY=0.01

# FALSE to disable running IRMA
DISABLE_IRMA=FALSE

# Whether to overwrite or not
OVERWRITE=FALSE

# If a job is killed mid job, sometimes snakemake will lock directories
FORCE_UNLOCK=TRUE

# Number of threads to use, or max jobs for multi-job 
THREADS=6

#multi-job cluster mode, add in cluster job details. THREADS above becomes number of jobs. Set to FALSE to run without new jobs
#CLUSTER_JOBS="sbatch -p priority -D /Flumina_test/Flumina --mem 40G --cpus-per-task=2"
CLUSTER_JOBS=FALSE

#temporary file directory, default set to working directory
TEMPDIR="${OUTPUT_DIRECTORY}/temp_dir"

# Run SNPGenie dN/dS analysis (TRUE or FALSE)
SNPGENIE=FALSE

# Optional: full path to snpgenie.pl if it is not on PATH
# SNPGENIE_PATH=/path/to/snpgenie.pl

#############################################
#### WFABC selection analysis (runWFABC.R)
#############################################

# Metadata column identifying the individual that is followed through time
INDIVIDUAL_COLUMN="Animal_ID"

# Metadata column holding the time point (numeric, e.g. days post infection)
TIME_COLUMN="DPI"

# Generations elapsed per unit of TIME_COLUMN (e.g. 6 viral generations per day)
GENERATIONS_PER_TIME=1

# Optional: directory containing the wfabc_1 and wfabc_2 binaries if not on PATH
# WFABC_PATH=/path/to/WFABC_v1.2/binaries/Mac

# Skip a site if the allele is near-fixed/near-lost at every time point
# (all freq >= cutoff OR all freq <= 1-cutoff). These have no identifiable
# selection signal and are the main cause of wfabc_2 hangs.
FIXATION_CUTOFF=0.98

# Per-call wfabc timeout in seconds; a call exceeding this is killed and the
# site is skipped (normal calls finish in well under 15s).
WFABC_TIMEOUT=120

# Cap on the ks-convergence refinement loop (prevents a non-converging site
# from looping forever).
MAX_REFINE_ITER=10
