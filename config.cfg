# Flumina configuration file.
#
# Every setting has a command-line equivalent; command-line values take
# precedence. No setting is required: `flumina -i raw_reads -o results` uses
# the defaults.
# Use this file to set multiple non-default options or document a run configuration.
#
#   flumina -c config.cfg
#
# Flumina automatically reads config.cfg from the working directory.


#############################################
#### Input and output
#############################################

# The output directory.                                             [-o]
OUTPUT_DIRECTORY="Flumina_results"

# The directory with your raw reads.                                [-i]
READ_DIRECTORY="raw_reads"

# CSV mapping read-pair file names ("File" column) to sample names
# ("Sample" column).                                                [-n]
RENAME_FILE="file_rename.csv"

# The reference file, one entry per gene segment.                   [-r]
# Use a reference appropriate for your dataset. The bundled reference.fa is an
# example and does not match arbitrary datasets.
REFERENCE_FILE="my_reference.fa"

# Optional curated CSV with columns "Gene", "Amino_Acid", and "Type".   [-a]
# Leave commented out to use the bundled database. Set it to NULL to skip the
# curated-site summary.
#AA_DB="curated_database.csv"

# Optional metadata file with at least a "Sample" column, for joins.    [-m]
# Without it, summaries are not grouped and no metadata columns are joined.
# WFABC needs it for the individual and time columns.
#METADATA="metadata.csv"

# Metadata column to group summaries by, for example host type. Set NULL for no
# grouping, which is also the default when there is no metadata.    [-g]
GROUP_NAMES="discrete_host"


#############################################
#### Programs to run
#############################################
#
# These switches enable or disable programs. Set TRUE to run a program and FALSE
# to skip it.
#
# For complete FluLens results, keep every switch below TRUE. FluLens
# reads the amino-acid table, the read pile-up, the assembly, the markers, and
# the selection results. If you set a switch FALSE, FluLens loses that part.
#
# Flumina stops with an error when an enabled program depends on a disabled
# program or when all variant callers are disabled.
#
# LoFreq and iVar report an allele fraction. GATK4 reports a genotype (a homozygous-alt
# call is 1.0). So the table can hold up to three rows per change. Dedupe on
# position and alternative first; the variant_id column gives that key.

# IRMA assembly. FLUMUT needs it.                                   [-s i]
IRMA=TRUE

# LoFreq variant caller. SNPGENIE needs it.                         [-s l]
LOFREQ=TRUE

# GATK4 variant caller.                                             [-s g]
GATK4=TRUE

# iVar variant caller.                                              [-s v]
IVAR=TRUE

# FluMut H5N1 marker screen of the IRMA consensus. Needs IRMA.      [-s m]
FLUMUT=TRUE

# WFABC selection analysis. Needs LoFreq or iVar, and metadata.     [-W]
WFABC=TRUE

# SNPGenie dN/dS analysis. Needs LoFreq.                            [-G]
SNPGENIE=TRUE


#############################################
#### Variant filtering
#############################################

# Minimum depth to keep a variant.                                  [-d]
# Below 100, LoFreq and GATK4 report false fixations from low template input.
# Keep it at least 100 unless you have a specific reason.
MIN_DEPTH=100

# Minimum quality to keep a variant (0 disables).                   [-q]
MIN_QUALITY=30

# Minimum allele frequency to consider a variant.                   [-f]
MIN_ALLELE_FREQUENCY=0.01

# Minimum alternate-allele read count. FluLens uses it as an assessment     [-b]
# floor. Variants with fewer supporting reads are flagged, not filtered
# upstream.
MIN_ALT=10

# Optional swab deduplication. Comma-separated metadata columns that identify
# one biological sample sequenced in more than one library. Flumina then keeps
# the deepest call per (these columns + locus/position/alternative). Leave unset
# to disable.
#DEDUP_KEYS=Individual,Timepoint,Tissue


#############################################
#### IRMA assembly
#############################################

# Optional IRMA parameter file, for example to set TMP or SINGLE_LOCAL_PROC. [-x]
# Flumina uses a file named irma_config.sh in the working directory automatically.
#IRMA_CONFIG="irma_config.sh"


#############################################
#### FluMut marker screening
#############################################
# These settings control FluMut. Enable or disable FluMut in
# "Programs to run" above.

# Also screen low-frequency variants for H5N1 markers. Requires IRMA and LoFreq.
# LoFreq variants at or above FLUMUT_FREQ_THRESHOLD are applied to the IRMA
# consensus, and the new sequences are screened.                    [-l]
FLUMUT_LOWFREQ=FALSE
FLUMUT_FREQ_THRESHOLD=0.01

# Screen the reference and subtract its findings from the sample results.
# The reference carries markers, every sample inherits them, and they hide the
# real calls. Set FALSE to keep the raw output; it is written as *_all.tsv
# either way.
FLUMUT_SUBTRACT_REFERENCE=TRUE

# FluMut is an H5N1 tool. Its HA and NA markers use H5/N1 numbering, so for
# another subtype the positions are read against the wrong ruler. The internal
# genes (PB2, PB1, PA, NP, NS) do not depend on the subtype and stay correct.
#
# FALSE (default) drops HA and NA markers when the reference subtype does not
# match. Subtype comes from the reference segment names (A_HA_H3, A_NA_N2); a
# bare A_HA counts as a mismatch. Dropped rows stay in markers_all.tsv.
FLUMUT_KEEP_MISMATCHED_HA_NA=FALSE


#############################################
#### Execution
#############################################

# Number of threads. With PROFILE=slurm, this is per step, not for the whole run. [-t]
THREADS=4

# Maximum memory for any one step, e.g. "32.GB". The default suits a laptop.  [-M]
#MAX_MEMORY="32.GB"

# Execution profile: standard, docker, apptainer, or slurm. Combine profiles with a
# comma, e.g. "slurm,apptainer".                                    [-p]
#PROFILE="docker"

# Directory for Nextflow's intermediate files.                      [-w]
# The default is ./work beside your results. Set it only when you submit from a
# place that is a poor home for a fast-growing directory. Every compute node
# must see it. Do not make it unique per job: it is the resume cache.
#WORK_DIRECTORY="/scratch/myuser/flumina_work"


#############################################
#### Cluster settings
#############################################
# Used with scheduler profiles: slurm, pbs, pbspro, sge, or lsf. Set PROFILE
# above, e.g. PROFILE="pbs,apptainer".

# Scheduler queue or partition. The default is the flu-crew Slurm queue and
# fails on any other cluster.                                       [-Q]
#CLUSTER_QUEUE="priority"

# Scheduler account options, passed through exactly as given, so use whatever
# syntax your scheduler expects.                                    [-A]
#CLUSTER_OPTIONS="--qos=myqos -A myaccount"

# Maximum jobs in flight at once. The main throughput dial for a large run.  [-j]
#QUEUE_SIZE=100


#############################################
#### Disk use
#############################################

# Delete the work directory on success and skip intermediate BAM files.     [-C]
# This switch is enabled by default. Set CLEANUP=FALSE to retain both for
# debugging or to resume a successful run.
#CLEANUP=FALSE

# Result publication mode: "copy", "link", or "symlink".
# "copy" is the safe default. "link" makes hard links, so results and work share
# the data and the run uses about half the space, but only when output and work
# are on the same filesystem. Avoid "symlink": deleting work breaks the links.
#PUBLISH_MODE="link"


#############################################
#### WFABC selection settings
#############################################
# These settings control WFABC. Enable or disable WFABC in the "Programs to
# run" above. WFABC needs the SAME individual sampled at two or more time
# points, so METADATA must have an individual column and a numeric time column.

# Metadata column identifying the individual followed through time.
INDIVIDUAL_COLUMN="Animal_ID"

# Metadata column containing the numeric time point, such as days post-infection.
TIME_COLUMN="DPI"

# Generations per unit of TIME_COLUMN, for example 6 viral generations per day.
GENERATIONS_PER_TIME=1

# Skip a site if the allele is nearly fixed or lost at every time point.
# These have no selection signal and are the main cause of wfabc_2 hangs.
FIXATION_CUTOFF=0.98

# Per-call WFABC timeout in seconds. A longer call is terminated and the site is
# skipped (normal calls finish well under 15s).
WFABC_TIMEOUT=120

# Maximum iterations for the KS-convergence refinement loop, so a site that does not converge
# cannot loop forever.
MAX_REFINE_ITER=10
