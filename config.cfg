# Flumina configuration file
#
# Every setting here has a command-line equivalent, and the command line wins.
# Nothing in this file is required: `flumina -i raw_reads -o results` runs with
# defaults for everything else. Use this file when you have more than a handful
# of non-default settings, or want a record of exactly how a run was configured.
#
#   flumina -c config.cfg
#
# A file named config.cfg in the working directory is picked up automatically.


#############################################
#### Input and output
#############################################

# The directory where output files will go                          [-o]
OUTPUT_DIRECTORY="Flumina_results"

# The directory where your raw reads are located                    [-i]
READ_DIRECTORY="raw_reads"

# CSV with the file name that matches both read pairs in the "File" column
# and the sample name in the "Sample" column                        [-n]
RENAME_FILE="file_rename.csv"

# The path to the reference file, one entry per gene segment        [-r]
# Leave commented out to use the reference bundled with Flumina.
#REFERENCE_FILE="my_reference.fa"

# OPTIONAL. Curated csv database with the columns "Gene", "Amino_Acid", and
# "Type" (category of site) of interest                             [-a]
# Leave commented out to use the database bundled with Flumina. Set it to NULL
# to skip the curated-site summary entirely.
#AA_DB="curated_database.csv"

# OPTIONAL. A metadata file with at least one column named "Sample" to join
# databases                                                         [-m]
# Without it, summaries are simply not grouped and no metadata columns are
# joined. Required only for WFABC, which needs the individual/time columns.
#METADATA="metadata.csv"

# Group column name from metadata to summarize and group data, i.e. cow versus
# birds versus poultry. Set to NULL for no grouping, which is also what happens
# automatically when no metadata is provided                        [-g]
GROUP_NAMES="discrete_host"


#############################################
#### Variant filtering
#############################################

# Minimum depth to keep a variant. Enforced when building the amino-acid table
# (findAAChanges.R). At low template input LoFreq/GATK4 report false fixations
# (founder/jackpot effect), so keep this >= 100 unless you have a specific
# reason                                                            [-d]
MIN_DEPTH=100

# Minimum quality to keep a variant (0 disables)                    [-q]
MIN_QUALITY=30

# Minimum allele frequency to consider a variant                    [-f]
MIN_ALLELE_FREQUENCY=0.01

# Optional swab deduplication (findAAChanges.R): comma-separated metadata
# columns that identify one biological sample sequenced in >1 replicate library.
# When set, replicate libraries are collapsed by keeping the DEEPEST call per
# (these columns + locus/position/alternative). Leave blank/unset to disable.
#DEDUP_KEYS=Animal.ID,DPI,Quarter


#############################################
#### Assembly and marker screening
#############################################

# TRUE to skip IRMA assembly                                        [-s i]
DISABLE_IRMA=FALSE

# Optional IRMA parameter file, e.g. to set TMP or SINGLE_LOCAL_PROC [-x]
# A file named irma_config.sh in the working directory is used automatically.
#IRMA_CONFIG="irma_config.sh"

# Screen the IRMA consensus for H5N1 markers with FluMut. Requires IRMA [-s m]
FLUMUT=TRUE

# Also screen LOW-FREQUENCY variants for H5N1 markers. LoFreq variants at or
# above FLUMUT_FREQ_THRESHOLD are applied to the IRMA consensus and the
# resulting sequences are screened                                  [-l]
FLUMUT_LOWFREQ=FALSE
FLUMUT_FREQ_THRESHOLD=0.01

# Screen the reference itself and subtract its own FluMut findings from the
# sample results. The reference carries markers of its own, every sample
# inherits them, and they swamp the real calls — on one 30-sample run, 2,514 of
# 2,515 reported marker rows were identical to the reference. Set FALSE to keep
# the raw output; it is written as *_all.tsv either way, next to reference_*.tsv
FLUMUT_SUBTRACT_REFERENCE=TRUE

# FluMut is an H5N1 tool. It will still report markers for other subtypes, and
# for the INTERNAL genes (PB2, PB1, PA, NP, NS) those are trustworthy — that
# biology does not depend on the HA. On the swine H3N2 run they were 50 of the
# 69 retained markers.
#
# Its HA and NA markers are a different matter: they are numbered for H5 and N1
# specifically (the database calls them HA1-5 and NA-1). On another subtype the
# positions are read against the wrong ruler, and H5/H3 have diverged enough
# that even a correctly mapped residue need not mean the same thing.
#
# FALSE (default) drops HA/NA markers when the reference subtype does not match.
# Subtype comes from the reference segment names (A_HA_H3, A_NA_N2); a bare
# A_HA cannot be confirmed and is treated as a mismatch. Dropped rows are kept
# in markers_all.tsv, so setting this TRUE only changes what markers.tsv shows.
FLUMUT_KEEP_MISMATCHED_HA_NA=FALSE


#############################################
#### Execution
#############################################

# Number of threads. With PROFILE=slurm this is per step, not for the whole
# run, since each step is its own job                                [-t]
THREADS=4

# Maximum memory any single step may use, e.g. "32.GB". The default suits a
# laptop; raise it on a workstation or cluster                       [-M]
#MAX_MEMORY="32.GB"

# Execution profile: standard, docker, apptainer, or slurm. Combine with a
# comma, e.g. "slurm,apptainer". Defaults to standard inside the Flumina
# container and docker outside it                                   [-p]
#PROFILE="docker"

# Directory for Nextflow's intermediate files                        [-w]
# Defaults to ./work beside your results, which is usually right. Set it only if
# you submit from somewhere that is a poor home for a constantly-written,
# fast-growing directory — home or project space with quotas and slow shared
# storage. With per-step job submission every compute node must be able to see
# it. Do NOT make it unique per job: this directory is the resume cache, so a
# per-job path silently makes -R useless.
#WORK_DIRECTORY="/scratch/myuser/flumina_work"


#############################################
#### Cluster settings
#############################################
# Used with the scheduler profiles: slurm, pbs (Torque/OpenPBS), pbspro, sge,
# or lsf. Set PROFILE above, e.g. PROFILE="pbs,apptainer"

# Scheduler queue/partition. The default is the flu-crew Slurm queue and will
# be rejected on any other cluster                                   [-Q]
#CLUSTER_QUEUE="priority"

# Scheduler account options, passed through exactly as given, so use whatever
# syntax your scheduler expects: '--qos=x -A acct' for Slurm, '-A acct' for
# PBS, and so on                                                     [-A]
#CLUSTER_OPTIONS="--qos=vpru -A nadc_iav"

# Maximum jobs in flight at once. The main throughput dial for a large run [-j]
#QUEUE_SIZE=100


#############################################
#### Disk use
#############################################

# Delete the work directory once the run completes successfully           [-C]
# The work directory holds every intermediate file and is roughly the size of
# the results again. Setting this discards the resume cache along with it, so
# leave it off while you are still getting a run to work, and turn it on for
# production runs.
#CLEANUP=TRUE

# How published results are written: "copy", "link", or "symlink".
# "copy" is the safe default. "link" makes hard links instead, so results and
# work share the same data and a run takes about half the space — but it only
# works when the output and work directories are on the SAME filesystem.
# Avoid "symlink": deleting the work directory would leave broken links.
#PUBLISH_MODE="link"


#############################################
#### SNPGenie dN/dS analysis
#############################################

# Run SNPGenie dN/dS analysis (TRUE or FALSE)                       [-G]
# Uses the same MIN_DEPTH and MIN_ALLELE_FREQUENCY thresholds set above.
# Results are written to snpGenie_results/
SNPGENIE=FALSE


#############################################
#### WFABC selection analysis (runWFABC.R)
#############################################

# Run WFABC selection analysis (TRUE or FALSE)                      [-W]
# Estimates per-site selection coefficients and effective population size from
# allele-frequency time series. Results are written to wfabc_analysis/
#
# This is the one analysis that is not per-sample: it needs the SAME individual
# sampled at two or more time points. Your METADATA must therefore have a column
# identifying the individual and a numeric column giving the time point, named
# below. Without those, there is no time series to fit and the step will stop
# with an error rather than produce an empty result.
WFABC=FALSE

# Metadata column identifying the individual that is followed through time
INDIVIDUAL_COLUMN="Animal_ID"

# Metadata column holding the time point (numeric, e.g. days post infection)
TIME_COLUMN="DPI"

# Generations elapsed per unit of TIME_COLUMN (e.g. 6 viral generations per day)
GENERATIONS_PER_TIME=1

# Skip a site if the allele is near-fixed/near-lost at every time point
# (all freq >= cutoff OR all freq <= 1-cutoff). These have no identifiable
# selection signal and are the main cause of wfabc_2 hangs.
FIXATION_CUTOFF=0.98

# Per-call wfabc timeout in seconds; a call exceeding this is killed and the
# site is skipped (normal calls finish in well under 15s).
WFABC_TIMEOUT=120

# Cap on the ks-convergence refinement loop (prevents a non-converging site
# from looping forever).
MAX_REFINE_ITER=10
