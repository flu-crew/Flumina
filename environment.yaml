name: Flumina
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - bwa=0.7.17
  - bioconductor-biostrings=2.66.0
  - fastp=0.23.4
  - gatk4=4.5.0.0
# NOT irma: bioconda's newest is 1.0.3, so IRMA is installed from the CDC's
# GitHub release in the Dockerfile instead (currently 1.3.5).
#
# IRMA feeds every read through `parallel --pipe`, and it used to arrive here
# only as an unpinned dependency of irma — so a rebuild silently picked up
# whatever GNU parallel released most recently. Release 20260722 broke --pipe
# outright: even `parallel --pipe cat` fails with "exec failed: No such file or
# directory", while ordinary non-pipe use is fine. IRMA then produces its whole
# output directory skeleton, empty, and STILL EXITS 0, so nothing downstream
# notices.
#
# IRMA 1.3.5 vendors its own parallel, but its set_bin() prefers whatever is on
# PATH, so a broken conda parallel would still win. Hence this stays pinned.
  - parallel=20240722
# Needed only to unpack the IRMA release during the image build.
  - unzip=6.0
  - lofreq=2.1.5
# iVar is the third caller. It reads a samtools mpileup on stdin and writes a
# TSV rather than a VCF, which is why convertVCFtoTable.R parses it separately.
#
# PINNED TO 1.4.3, AND NOT HIGHER, BECAUSE OF BWA. ivar 1.4.4 requires
# libzlib >=1.3.1; every bwa 0.7.17 build on bioconda needs zlib <1.3, and the
# two cannot both be satisfied. The solver reports this as an ivar/zlib problem,
# which reads like a packaging detail and is not one — the only way to take
# 1.4.4 is to move bwa, and moving the mapper changes every BAM and therefore
# every variant call in the pipeline. A caller version is worth far less than
# that. 1.4.3 resolves with bwa 0.7.17, zlib 1.2.13 and samtools 1.19.2 all
# unchanged, and writes the same variants TSV that convertVCFtoTable.R reads.
  - ivar=1.4.3
  - python=3.10.14
  - samtools=1.19
  - r-doparallel=1.0.17
  - r-ape=5.7_1
  - r-data.table=1.14.8
  - r-essentials=4.2
  - r-seqinr=4.2_30
  - r-stringr=1.5.0
  - r-foreach=1.5.2
  - r-coda=0.19_4
  - flumut=0.6.5

