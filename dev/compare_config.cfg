# Config for running the legacy Snakemake pipeline inside the Flumina container,
# for head-to-head comparison against the Nextflow port. Paths are container
# paths (/w is the repo bind-mount). Settings deliberately mirror the Nextflow
# `test` profile so the only variable is the workflow engine.
OUTPUT_DIRECTORY="/w/snakemake_results"
READ_DIRECTORY="/w/test_dataset/raw_reads"
RENAME_FILE="/w/example_file_rename.csv"
REFERENCE_FILE="/w/reference.fa"
AA_DB="/w/curated_database.csv"
METADATA="/w/example_metadata.csv"
GROUP_NAMES="discrete_host"
MIN_DEPTH=100
MIN_QUALITY=30
MIN_ALLELE_FREQUENCY=0.01
DISABLE_IRMA=TRUE
OVERWRITE=FALSE
FORCE_UNLOCK=TRUE
THREADS=4
CLUSTER_JOBS=FALSE
TEMPDIR="/tmp"
SNPGENIE=FALSE
INDIVIDUAL_COLUMN="Animal_ID"
TIME_COLUMN="DPI"
GENERATIONS_PER_TIME=1
FIXATION_CUTOFF=0.98
WFABC_TIMEOUT=120
MAX_REFINE_ITER=10
